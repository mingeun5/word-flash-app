<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Word Flash</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #687386;
        --line: #dde3ee;
        --brand: #176b87;
        --brand-dark: #0f5269;
        --accent: #d95f39;
        --danger: #b42318;
        --shadow: 0 16px 36px rgba(23, 32, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .app-shell {
        width: min(100%, 560px);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.15;
      }

      .sync-status {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .icon-button {
        width: 46px;
        flex: 0 0 46px;
        font-size: 20px;
      }

      .settings-panel {
        display: none;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 22px rgba(23, 32, 51, 0.08);
      }

      .settings-panel.open {
        display: block;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: #fbfcff;
        color: var(--text);
        outline: none;
      }

      .field input:focus,
      .field select:focus {
        border-color: var(--brand);
      }

      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 120px;
        gap: 10px;
      }

      .settings-actions,
      .primary-actions,
      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .learner-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .learner-button {
        min-height: 44px;
        background: #eef3f7;
      }

      .learner-button.active {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }

      .primary-actions {
        grid-template-columns: 1fr 1.2fr 1fr;
      }

      .secondary-button {
        background: #eef3f7;
      }

      .mode-switch {
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #e9eef5;
      }

      .mode-button {
        border: 0;
        background: transparent;
      }

      .mode-button.active {
        background: var(--panel);
        color: var(--brand-dark);
        box-shadow: 0 2px 8px rgba(23, 32, 51, 0.1);
      }

      .card-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 360px;
      }

      .position-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 14px;
      }

      .word-card {
        flex: 1;
        min-height: 310px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 20px;
        text-align: center;
      }

      .word-content {
        width: 100%;
      }

      .word-text {
        overflow-wrap: anywhere;
        font-size: clamp(42px, 15vw, 78px);
        line-height: 1.05;
        font-weight: 850;
        letter-spacing: 0;
      }

      .meaning-text {
        margin-top: 22px;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: clamp(22px, 6vw, 34px);
        line-height: 1.25;
        font-weight: 750;
      }

      .empty-state {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .hidden {
        display: none;
      }

      .message-box {
        min-height: 22px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .message-box.error {
        color: var(--danger);
        font-weight: 700;
      }

      .primary-button,
      .done-button {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }

      .primary-button:active,
      .done-button:active {
        background: var(--brand-dark);
      }

      .done-button {
        width: 100%;
        min-height: 54px;
        border-radius: 8px;
        font-size: 18px;
      }

      .dict-button {
        min-height: 48px;
        border: 1px solid #1f8f4a;
        border-radius: 8px;
        background: #1f8f4a;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-weight: 800;
      }

      .dict-button.disabled {
        pointer-events: none;
        opacity: 0.5;
      }

      @media (max-width: 380px) {
        .app-shell {
          padding-left: 12px;
          padding-right: 12px;
        }

        .settings-grid {
          grid-template-columns: 1fr;
        }

        .primary-actions {
          gap: 8px;
        }

        button {
          min-height: 44px;
          padding-left: 8px;
          padding-right: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <h1>Word Flash</h1>
          <p id="syncStatus" class="sync-status">Google Sheets URL을 설정하세요.</p>
        </div>
        <button id="settingsToggle" class="icon-button" type="button" aria-label="설정 열기">⚙</button>
      </header>

      <section id="settingsPanel" class="settings-panel" aria-label="설정">
        <label class="field">
          <span>Apps Script Web App URL</span>
          <input id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/AKfycbwM88J7xPTffNwMMvi9fxkZ5Et7_0IwhEsUx0JH9vCUXuDTYTg4Rr75I_CdO8FwMkZmow/exec" autocomplete="off">
        </label>

        <div class="settings-grid">
          <div class="field">
            <span>학습자</span>
            <div class="learner-options" role="group" aria-label="학습자 선택">
              <button id="learnerSuyeonBtn" class="learner-button active" type="button" data-learner="수연">수연</button>
              <button id="learnerMingeunBtn" class="learner-button" type="button" data-learner="민근">민근</button>
            </div>
          </div>

          <label class="field">
            <span>표시 방식</span>
            <select id="displayModeSelect">
              <option value="word">영어만</option>
              <option value="wordMeaning">영어 + 뜻</option>
            </select>
          </label>

          <label class="field">
            <span>표시 시간(초)</span>
            <input id="intervalInput" type="number" min="1" max="60" step="1">
          </label>
        </div>

        <div class="settings-actions">
          <button id="saveSettingsBtn" class="secondary-button" type="button">설정 저장</button>
          <button id="reloadBtn" class="secondary-button" type="button">단어 다시 불러오기</button>
        </div>
      </section>

      <section class="mode-switch" aria-label="학습 모드">
        <button id="studyModeBtn" class="mode-button active" type="button" data-mode="study">전체 학습</button>
        <button id="remindModeBtn" class="mode-button" type="button" data-mode="remind">리마인드</button>
      </section>

      <section class="card-area" aria-live="polite">
        <div class="position-row">
          <span id="modeLabel">전체 학습</span>
          <strong id="positionLabel">0 / 0</strong>
        </div>

        <article class="word-card">
          <div id="emptyState" class="empty-state">
            단어 목록을 불러오면 학습을 시작할 수 있습니다.
          </div>
          <div id="wordContent" class="word-content hidden">
            <div id="wordText" class="word-text"></div>
            <div id="meaningText" class="meaning-text"></div>
          </div>
        </article>

        <p id="messageBox" class="message-box" role="status"></p>
      </section>

      <a id="naverDictLink" class="dict-button disabled" href="#" target="_blank" rel="noopener noreferrer">네이버사전</a>

      <section class="primary-actions" aria-label="학습 조작">
        <button id="prevBtn" type="button">이전</button>
        <button id="startPauseBtn" class="primary-button" type="button">시작</button>
        <button id="nextBtn" type="button">다음</button>
      </section>

      <button id="markDoneBtn" class="done-button" type="button">암기완료</button>
    </main>

    <script>
      (function () {
        "use strict";

        var SETTINGS_KEY = "wordFlashSettings";
        var DONE_VALUE = "Y";
        var OLD_DEFAULT_API_URLS = [
          "https://script.google.com/macros/s/AKfycby-gwtgEfiBzf84HvSnHM_lzVPwAJdn8wujI0WVmeU9QO0Wjl5k1Zm9c6sMGhDSs0UZHw/exec",
          "https://script.google.com/macros/s/AKfycbxCvTHbjC5fblthDJuRaW-um8rJqg9oLvEUmndE7892zxEada_YEKvOs1NFld15i4w8nQ/exec"
        ];
        var DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwM88J7xPTffNwMMvi9fxkZ5Et7_0IwhEsUx0JH9vCUXuDTYTg4Rr75I_CdO8FwMkZmow/exec";
        var DEFAULT_LEARNER = "수연";
        var ALLOWED_LEARNERS = ["수연", "민근"];

        var state = {
          settings: {
            apiUrl: DEFAULT_API_URL,
            learner: DEFAULT_LEARNER,
            displayMode: "word",
            intervalSeconds: 3
          },
          allWords: [],
          visibleWords: [],
          mode: "study",
          currentIndex: 0,
          timerId: null,
          isRunning: false,
          isLoading: false
        };

        var els = {};

        document.addEventListener("DOMContentLoaded", init);

        function init() {
          bindElements();
          loadSettings();
          bindEvents();
          applySettingsToForm();
          applyModeButtons();
          render();

          if (state.settings.apiUrl) {
            fetchWords();
          }
        }

        function bindElements() {
          els.syncStatus = document.getElementById("syncStatus");
          els.settingsToggle = document.getElementById("settingsToggle");
          els.settingsPanel = document.getElementById("settingsPanel");
          els.apiUrlInput = document.getElementById("apiUrlInput");
          els.learnerButtons = Array.prototype.slice.call(document.querySelectorAll("[data-learner]"));
          els.displayModeSelect = document.getElementById("displayModeSelect");
          els.intervalInput = document.getElementById("intervalInput");
          els.saveSettingsBtn = document.getElementById("saveSettingsBtn");
          els.reloadBtn = document.getElementById("reloadBtn");
          els.studyModeBtn = document.getElementById("studyModeBtn");
          els.remindModeBtn = document.getElementById("remindModeBtn");
          els.modeLabel = document.getElementById("modeLabel");
          els.positionLabel = document.getElementById("positionLabel");
          els.emptyState = document.getElementById("emptyState");
          els.wordContent = document.getElementById("wordContent");
          els.wordText = document.getElementById("wordText");
          els.meaningText = document.getElementById("meaningText");
          els.messageBox = document.getElementById("messageBox");
          els.naverDictLink = document.getElementById("naverDictLink");
          els.prevBtn = document.getElementById("prevBtn");
          els.startPauseBtn = document.getElementById("startPauseBtn");
          els.nextBtn = document.getElementById("nextBtn");
          els.markDoneBtn = document.getElementById("markDoneBtn");
        }

        function bindEvents() {
          els.settingsToggle.addEventListener("click", function () {
            els.settingsPanel.classList.toggle("open");
          });

          els.saveSettingsBtn.addEventListener("click", saveSettingsFromForm);
          els.reloadBtn.addEventListener("click", fetchWords);
          els.learnerButtons.forEach(function (button) {
            button.addEventListener("click", function () {
              state.settings.learner = normalizeLearner(button.dataset.learner);
              saveSettings();
              applyLearnerButtons();
              fetchWords();
            });
          });
          els.displayModeSelect.addEventListener("change", function () {
            state.settings.displayMode = els.displayModeSelect.value;
            saveSettings();
            render();
          });
          els.intervalInput.addEventListener("change", function () {
            state.settings.intervalSeconds = normalizeInterval(els.intervalInput.value);
            els.intervalInput.value = state.settings.intervalSeconds;
            saveSettings();
            restartTimerIfRunning();
          });

          els.studyModeBtn.addEventListener("click", function () {
            setMode("study");
          });
          els.remindModeBtn.addEventListener("click", function () {
            setMode("remind");
          });

          els.prevBtn.addEventListener("click", prevWord);
          els.nextBtn.addEventListener("click", nextWord);
          els.startPauseBtn.addEventListener("click", toggleRunning);
          els.markDoneBtn.addEventListener("click", markCurrentDone);
        }

        function loadSettings() {
          try {
            var saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
            state.settings.apiUrl = normalizeApiUrl(saved.apiUrl);
            state.settings.learner = normalizeLearner(saved.learner || DEFAULT_LEARNER);
            state.settings.displayMode = saved.displayMode === "wordMeaning" ? "wordMeaning" : "word";
            state.settings.intervalSeconds = normalizeInterval(saved.intervalSeconds || 3);
          } catch (error) {
            state.settings.intervalSeconds = 3;
          }
        }

        function applySettingsToForm() {
          els.apiUrlInput.value = state.settings.apiUrl;
          applyLearnerButtons();
          els.displayModeSelect.value = state.settings.displayMode;
          els.intervalInput.value = state.settings.intervalSeconds;
        }

        function saveSettingsFromForm() {
          state.settings.apiUrl = els.apiUrlInput.value.trim();
          state.settings.learner = normalizeLearner(state.settings.learner);
          state.settings.displayMode = els.displayModeSelect.value;
          state.settings.intervalSeconds = normalizeInterval(els.intervalInput.value);
          els.intervalInput.value = state.settings.intervalSeconds;
          saveSettings();
          setMessage("설정을 저장했습니다.", false);

          if (state.settings.apiUrl) {
            fetchWords();
          } else {
            els.syncStatus.textContent = "Google Sheets URL을 설정하세요.";
          }
        }

        function saveSettings() {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
        }

        function normalizeInterval(value) {
          var seconds = parseInt(value, 10);
          if (Number.isNaN(seconds)) return 3;
          return Math.min(Math.max(seconds, 1), 60);
        }

        function normalizeApiUrl(value) {
          if (!value || OLD_DEFAULT_API_URLS.indexOf(value) !== -1) {
            return DEFAULT_API_URL;
          }

          return value;
        }

        function normalizeLearner(value) {
          return ALLOWED_LEARNERS.indexOf(value) === -1 ? DEFAULT_LEARNER : value;
        }

        function applyLearnerButtons() {
          els.learnerButtons.forEach(function (button) {
            button.classList.toggle("active", button.dataset.learner === state.settings.learner);
          });
        }

        function setMode(mode) {
          if (state.mode === mode) return;
          pause();
          state.mode = mode;
          state.currentIndex = 0;
          applyModeButtons();
          rebuildVisibleWords();
          render();
        }

        function applyModeButtons() {
          els.studyModeBtn.classList.toggle("active", state.mode === "study");
          els.remindModeBtn.classList.toggle("active", state.mode === "remind");
          els.modeLabel.textContent = state.mode === "study" ? "전체 학습" : "리마인드";
        }

        function fetchWords() {
          if (!state.settings.apiUrl) {
            setMessage("설정에서 Apps Script Web App URL을 입력하세요.", true);
            els.settingsPanel.classList.add("open");
            return;
          }

          pause();
          state.isLoading = true;
          updateDisabledState();
          setMessage(state.settings.learner + " 단어 목록을 불러오는 중입니다.", false);
          els.syncStatus.textContent = "동기화 중...";

          var requestUrl;
          try {
            requestUrl = buildApiUrlWithSheetName();
          } catch (error) {
            state.isLoading = false;
            updateDisabledState();
            setMessage("Apps Script Web App URL이 올바르지 않습니다.", true);
            els.syncStatus.textContent = "URL 오류";
            render();
            return;
          }

          requestJsonp(requestUrl)
            .then(function (data) {
              if (!data.success || !Array.isArray(data.words)) {
                throw new Error(data.error || "단어 목록 형식이 올바르지 않습니다.");
              }

              state.allWords = data.words
                .map(normalizeWord)
                .filter(function (item) {
                  return item.word;
                });
              state.currentIndex = 0;
              rebuildVisibleWords();
              setMessage(state.settings.learner + " 단어 " + state.allWords.length + "개를 불러왔습니다.", false);
              els.syncStatus.textContent = "Google Sheets 연결됨: " + state.settings.learner;
            })
            .catch(function (error) {
              state.allWords = [];
              state.visibleWords = [];
              state.currentIndex = 0;
              setMessage("단어 목록 조회 실패: " + error.message, true);
              els.syncStatus.textContent = "동기화 실패";
            })
            .finally(function () {
              state.isLoading = false;
              updateDisabledState();
              render();
            });
        }

        function normalizeWord(item) {
          return {
            row: Number(item.rowNumber || item.row || 0),
            word: String(item.word || "").trim(),
            meaning: String(item.meaning || "").trim(),
            memorized: String(item.memorized || item.done || "").trim()
          };
        }

        function rebuildVisibleWords() {
          state.visibleWords = state.allWords.filter(function (item) {
            var hasDoneValue = Boolean(item.memorized);
            return state.mode === "study" ? !hasDoneValue : hasDoneValue;
          });

          if (state.currentIndex >= state.visibleWords.length) {
            state.currentIndex = Math.max(state.visibleWords.length - 1, 0);
          }
        }

        function render() {
          var total = state.visibleWords.length;
          var current = total > 0 ? state.visibleWords[state.currentIndex] : null;
          els.positionLabel.textContent = total > 0 ? state.currentIndex + 1 + " / " + total : "0 / 0";

          if (!current) {
            els.emptyState.classList.remove("hidden");
            els.wordContent.classList.add("hidden");
            els.emptyState.textContent = emptyText();
          } else {
            els.emptyState.classList.add("hidden");
            els.wordContent.classList.remove("hidden");
            els.wordText.textContent = current.word;
            els.meaningText.textContent = current.meaning;
            els.meaningText.classList.toggle("hidden", state.settings.displayMode !== "wordMeaning");
          }

          updateDictionaryLink(current);
          els.startPauseBtn.textContent = state.isRunning ? "일시정지" : "시작";
          updateDisabledState();
        }

        function updateDictionaryLink(current) {
          if (!current || !current.word) {
            els.naverDictLink.href = "#";
            els.naverDictLink.classList.add("disabled");
            return;
          }

          els.naverDictLink.href = "https://en.dict.naver.com/#/search?query=" + encodeURIComponent(current.word);
          els.naverDictLink.classList.remove("disabled");
        }

        function emptyText() {
          if (!state.settings.apiUrl) return "설정에서 Google Apps Script Web App URL을 저장하세요.";
          if (state.isLoading) return "단어 목록을 불러오는 중입니다.";
          if (!state.allWords.length) return "시트에 학습할 단어가 없습니다.";
          return state.mode === "study"
            ? "기본 학습 대상 단어가 없습니다."
            : "리마인드 대상 단어가 없습니다.";
        }

        function updateDisabledState() {
          var hasWords = state.visibleWords.length > 0;
          els.prevBtn.disabled = state.isLoading || !hasWords;
          els.nextBtn.disabled = state.isLoading || !hasWords;
          els.startPauseBtn.disabled = state.isLoading || !hasWords;
          els.markDoneBtn.disabled = state.isLoading || !hasWords;
          els.reloadBtn.disabled = state.isLoading;
        }

        function toggleRunning() {
          if (state.isRunning) {
            pause();
          } else {
            start();
          }
          render();
        }

        function start() {
          if (!state.visibleWords.length) return;
          pause();
          state.isRunning = true;
          state.timerId = window.setInterval(nextWord, state.settings.intervalSeconds * 1000);
        }

        function pause() {
          state.isRunning = false;
          if (state.timerId) {
            window.clearInterval(state.timerId);
            state.timerId = null;
          }
        }

        function restartTimerIfRunning() {
          if (!state.isRunning) return;
          start();
          render();
        }

        function nextWord() {
          if (!state.visibleWords.length) return;
          state.currentIndex = (state.currentIndex + 1) % state.visibleWords.length;
          render();
        }

        function prevWord() {
          if (!state.visibleWords.length) return;
          state.currentIndex =
            (state.currentIndex - 1 + state.visibleWords.length) % state.visibleWords.length;
          render();
        }

        function markCurrentDone() {
          var current = state.visibleWords[state.currentIndex];
          if (!current || !current.row) {
            setMessage("갱신할 행 번호를 찾을 수 없습니다.", true);
            return;
          }

          els.markDoneBtn.disabled = true;
          setMessage("암기완료 처리 중입니다.", false);

          fetch(state.settings.apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              sheetName: state.settings.learner,
              rowNumber: current.row,
              memorized: DONE_VALUE
            })
          })
            .then(parseJsonResponse)
            .catch(function () {
              return requestJsonp(buildMarkDoneUrl(current.row));
            })
            .then(function (data) {
              if (!data.success) {
                throw new Error(data.error || "갱신에 실패했습니다.");
              }

              current.memorized = data.memorized || DONE_VALUE;
              updateAllWords(current);
              rebuildVisibleWords();
              setMessage("암기완료로 저장했습니다.", false);
              render();
            })
            .catch(function (error) {
              setMessage("암기완료 실패: " + error.message, true);
            })
            .finally(updateDisabledState);
        }

        function updateAllWords(updated) {
          state.allWords = state.allWords.map(function (item) {
            return item.row === updated.row ? updated : item;
          });
        }

        function parseJsonResponse(response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        }

        function buildApiUrlWithSheetName() {
          var url = new URL(state.settings.apiUrl, window.location.href);
          url.searchParams.set("sheetName", state.settings.learner);
          return url.toString();
        }

        function buildMarkDoneUrl(rowNumber) {
          var url = new URL(state.settings.apiUrl, window.location.href);
          url.searchParams.set("sheetName", state.settings.learner);
          url.searchParams.set("action", "markDone");
          url.searchParams.set("rowNumber", rowNumber);
          url.searchParams.set("memorized", DONE_VALUE);
          return url.toString();
        }

        function requestJsonp(url) {
          return new Promise(function (resolve, reject) {
            var callbackName = "wordFlashCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
            var script = document.createElement("script");
            var timeoutId = window.setTimeout(function () {
              cleanup();
              reject(new Error("Apps Script 응답 시간이 초과되었습니다."));
            }, 15000);

            function cleanup() {
              window.clearTimeout(timeoutId);
              delete window[callbackName];
              if (script.parentNode) {
                script.parentNode.removeChild(script);
              }
            }

            window[callbackName] = function (data) {
              cleanup();
              resolve(data);
            };

            script.onerror = function () {
              cleanup();
              reject(new Error("Apps Script를 불러오지 못했습니다."));
            };
            script.src = appendQueryParam(url, "callback", callbackName);
            document.body.appendChild(script);
          });
        }

        function appendQueryParam(url, key, value) {
          var nextUrl = new URL(url, window.location.href);
          nextUrl.searchParams.set(key, value);
          nextUrl.searchParams.set("_", Date.now());
          return nextUrl.toString();
        }

        function setMessage(message, isError) {
          els.messageBox.textContent = message || "";
          els.messageBox.classList.toggle("error", Boolean(isError));
        }
      })();
    </script>
  </body>
</html>
